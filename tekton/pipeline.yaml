apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: accounts-cd
spec:
  params:
    - name: git-url
      type: string
    - name: revision
      type: string
      default: main
    - name: image
      type: string
    - name: namespace
      type: string
      default: default
  workspaces:
    - name: source
    - name: registry-auth
    - name: kubeconfig
  tasks:
    - name: clone
      taskRef:
        name: git-clone
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: output
          workspace: source
    - name: ci
      runAfter:
        - clone
      taskRef:
        name: accounts-ci
      workspaces:
        - name: source
          workspace: source
    - name: build
      runAfter:
        - ci
      taskRef:
        name: accounts-build
      params:
        - name: image
          value: $(params.image)
      workspaces:
        - name: source
          workspace: source
        - name: registry-auth
          workspace: registry-auth
    - name: deploy
      runAfter:
        - build
      taskRef:
        name: accounts-deploy
      params:
        - name: image
          value: $(params.image)
        - name: namespace
          value: $(params.namespace)
      workspaces:
        - name: source
          workspace: source
        - name: kubeconfig
          workspace: kubeconfig
