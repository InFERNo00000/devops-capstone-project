[nosetests]
verbosity = 2
with-coverage = 1
cover-package = service
cover-erase = 1
cover-branches = 1
cover-inclusive = 1
cover-html = 1
cover-html-dir = build/coverage
cover-xml = 1
cover-xml-file = build/coverage.xml
with-spec = 1
spec-color = 1
tests = tests

[coverage:run]
branch = True
source = service
omit = tests/*

[coverage:report]
show_missing = True
skip_covered = True
fail_under = 80

[coverage:html]
directory = build/coverage

[coverage:xml]
output = build/coverage.xml

[flake8]
max-line-length = 127
max-complexity = 10
exclude = .git,.venv,__pycache__,build,dist
count = True
statistics = True
show-source = True
per-file-ignores =
    __init__.py:F401

[pylint]
max-line-length = 127
disable =
    missing-module-docstring,
    missing-class-docstring,
    missing-function-docstring,
    E1101
fail-under = 9.0
reports = no
