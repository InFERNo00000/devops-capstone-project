[nosetests]
verbosity = 2
with-coverage = 1
cover-package = service
cover-erase = 1
cover-branches = 1
cover-inclusive = 1
cover-html = 1
cover-html-dir = build/coverage
cover-xml = 1
cover-xml-file = build/coverage.xml
tests = tests

[coverage:run]
branch = True
source = service
omit = tests/*

[coverage:report]
show_missing = True
skip_covered = True
fail_under = 80

[coverage:html]
directory = build/coverage

[coverage:xml]
output = build/coverage.xml

[flake8]
max-line-length = 100
exclude = .git,.venv,__pycache__,build,dist
count = True
statistics = True
show-source = True
ignore = E203,W503

[pylint]
max-line-length = 100
disable = missing-module-docstring,missing-class-docstring,missing-function-docstring
fail-under = 9.0
reports = no
