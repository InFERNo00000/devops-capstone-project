[nosetests]
verbosity = 2
with-coverage = 1
cover-package = service
cover-erase = 1
tests = tests

[coverage:run]
branch = True
source = service

[flake8]
max-line-length = 100
exclude = .git,.venv,__pycache__,build,dist

[pylint]
max-line-length = 100
disable = missing-module-docstring,missing-class-docstring,missing-function-docstring
